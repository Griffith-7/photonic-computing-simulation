name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    name: Build & Test (Windows)

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-eigen3

    - name: Configure
      shell: msys2 {0}
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: msys2 {0}
      run: ninja -C build

    - name: Run Unit Tests
      shell: msys2 {0}
      run: ./build/onn_tests

    - name: Run Benchmark (Quick)
      shell: msys2 {0}
      run: ./build/onn_benchmark --benchmark_mzi --benchmark_mesh --benchmark_forward --benchmark_mem_power
